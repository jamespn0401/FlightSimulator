name: CMake CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu GCC
            os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
            build_type: Release

          - name: Ubuntu Clang
            os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
            build_type: Release

          - name: Windows MSVC
            os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
            build_type: Release

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Configure CMake
        run: >
          cmake -S .
          -B build
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
          ${{ matrix.os == 'ubuntu-latest' && format('-DCMAKE_BUILD_TYPE={0}', matrix.build_type) || '' }}

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }}

      - name: Test
        run: ctest --test-dir build --build-config ${{ matrix.build_type }} --output-on-failure
