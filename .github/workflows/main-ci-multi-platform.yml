name: Main CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # 1. C++ build + test (multi-platform)
  cpp-build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu GCC
            os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
            build_type: Release

          - name: Ubuntu Clang
            os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
            build_type: Release

          - name: Windows MSVC
            os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
            build_type: Release

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Configure CMake
        run: >
          cmake -S .
          -B build
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
          ${{ matrix.os == 'ubuntu-latest' && format('-DCMAKE_BUILD_TYPE={0}', matrix.build_type) || '' }}

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }}

      - name: Test
        run: ctest --test-dir build --build-config ${{ matrix.build_type }} --output-on-failure

  # 2. Python + integration (depends on Linux build)
  python-test:
    runs-on: ubuntu-latest
    needs: cpp-build # waits for ALL builds to pass

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Rebuild ONLY on Linux (needed for simulator)
      - name: Build simulator (Linux)
        run: |
          cmake -S . -B build
          cmake --build build

      - name: Run Python unit tests
        env:
          PYTHONPATH: .
        run: pytest -q

      - name: Run integration script
        run: python plot.py

      - name: Upload plots
        uses: actions/upload-artifact@v4
        with:
          name: simulation-plots
          path: output/*.png
          if-no-files-found: warn
