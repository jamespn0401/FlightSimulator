name: Deploy

on:
  workflow_run:
    workflows: ["Main CI"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Ubuntu server
    runs-on: ubuntu-latest

    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      )

    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Setup SSH
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SERVER_HOST:-}" ]; then
            echo "❌ SERVER_HOST secret is empty or missing."
            exit 1
          fi

          if [ -z "${SERVER_USER:-}" ]; then
            echo "❌ SERVER_USER secret is empty or missing."
            exit 1
          fi

          if [ -z "${SSH_PRIVATE_KEY:-}" ]; then
            echo "❌ SSH_PRIVATE_KEY secret is empty or missing."
            exit 1
          fi

          PORT="${SERVER_PORT:-22}"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          echo "Checking TCP connectivity to $SERVER_HOST:$PORT ..."
          if ! timeout 10 bash -c "</dev/tcp/$SERVER_HOST/$PORT" 2>/dev/null; then
            echo "❌ Cannot reach $SERVER_HOST on port $PORT from GitHub Actions."
            echo "Check SERVER_HOST, SERVER_PORT, firewall/security group, and that sshd is running."
            exit 1
          fi

          echo "Scanning SSH host key..."
          ssh-keyscan -p "$PORT" -H "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null || {
            echo "❌ ssh-keyscan failed for $SERVER_HOST:$PORT"
            echo "Check DNS, firewall, and SSH port."
            exit 1
          }

      - name: Debug SSH auth
        shell: bash
        continue-on-error: true
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -euo pipefail
          PORT="${SERVER_PORT:-22}"

          ssh -vvv -i ~/.ssh/id_ed25519 \
            -p "$PORT" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            "$SERVER_USER@$SERVER_HOST" \
            "echo connected" || true

      - name: Deploy on server
        shell: bash
        env:
          TARGET_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -euo pipefail

          PORT="${SERVER_PORT:-22}"

          ssh -i ~/.ssh/id_ed25519 \
            -p "$PORT" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$SERVER_USER@$SERVER_HOST" \
            "TARGET_SHA='$TARGET_SHA' bash -s" << 'EOF'
              set -euo pipefail

              PROJECT_DIR="$HOME/Applications/FlightSimulator"

              if [ ! -d "$PROJECT_DIR/.git" ]; then
                echo "❌ Project not found on server. Please set up the repository first."
                exit 1
              fi

              cd "$PROJECT_DIR"
              git fetch --all --prune

              CURRENT_SHA="$(git rev-parse HEAD)"

              if [ "$CURRENT_SHA" = "$TARGET_SHA" ]; then
                echo "✅ No changes detected. Skipping rebuild."
                exit 0
              fi

              git checkout --force main
              git reset --hard "$TARGET_SHA"

              cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
              cmake --build build --config Release
              ctest --test-dir build --output-on-failure

              echo "✅ Deployment complete."
          EOF
