name: Deploy

on:
  workflow_run:
    workflows: ["Main CI"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Ubuntu server
    runs-on: ubuntu-latest

    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      )

    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Setup SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy on server
        shell: bash
        env:
          TARGET_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail

          ssh -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=yes \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            "TARGET_SHA='$TARGET_SHA' bash -s" << 'EOF'
              set -euo pipefail

              PROJECT_DIR="$HOME/Applications/FlightSimulator"

              if [ ! -d "$PROJECT_DIR/.git" ]; then
                echo "❌ Project not found on server. Please set up the repository first."
                exit 1
              fi

              cd "$PROJECT_DIR"
              echo "✅ Found project, continuing..."

              git fetch --all --prune

              CURRENT_SHA="$(git rev-parse HEAD)"

              if [ "$CURRENT_SHA" = "$TARGET_SHA" ]; then
                echo "✅ No changes detected. Skipping rebuild."
                exit 0
              fi

              echo "🚀 Changes detected. Deploying commit $TARGET_SHA"
              git checkout --force main
              git reset --hard "$TARGET_SHA"

              cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
              cmake --build build --config Release
              ctest --test-dir build --output-on-failure

              echo "✅ Deployment complete."
          EOF
